# Every value here reads from an environment variable first. Nothing secret is
# committed: the database password and the JWT signing key have no default at
# all, and the application tells you at startup if a required one is missing.
# See .env.example for the full list.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medical_on_time?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Signing key for the access tokens. Leave it unset locally and a random key is
# generated for the run, which signs everyone out on restart. Set it anywhere
# that matters.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:120}

# Comma separated. The React dev server is the only origin allowed by default.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Used once, to create the first admin on an empty database. If no password is
# given, one is generated and printed to the log on that first run only.
app.seed.admin-username=${ADMIN_USERNAME:admin}
app.seed.admin-password=${ADMIN_PASSWORD:}
